<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phishing-Check: Echt oder Fake?</title>
  
<link rel="icon" type="image/png" href="favicon.png">

<style>
:root{
  --bg:#f3f6fb; --card:#ffffff; --text:#14213d; --muted:#5b6780; --line:#d9e0ec;
  --brand:#0a4fd6; --warn:#f59e0b; --warnbg:#fff3d6;
  --ok:#15803d; --okbg:#dcfce7; --bad:#c62828; --badbg:#fde4e4; --miss:#b45309; --missbg:#fff1d6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
 .eyebrow{
  display:block;
  margin-bottom:8px;
  color:var(--muted);
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.1em;
} 
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1420; --card:#18202f; --text:#eef2fb; --muted:#9aa7c0; --line:#2b3650;
    --brand:#6ea0ff; --warn:#fbbf24; --warnbg:#3a2f10;
    --ok:#4ade80; --okbg:#12301d; --bad:#ff8a8a; --badbg:#3a1717; --miss:#fbbf24; --missbg:#3a2f10;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1420; --card:#18202f; --text:#eef2fb; --muted:#9aa7c0; --line:#2b3650;
  --brand:#6ea0ff; --warn:#fbbf24; --warnbg:#3a2f10;
  --ok:#4ade80; --okbg:#12301d; --bad:#ff8a8a; --badbg:#3a1717; --miss:#fbbf24; --missbg:#3a2f10;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;
  color:var(--text);
  font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;

  background:
    radial-gradient(circle at 15% -10%, rgba(10,79,214,.09), transparent 38%),
    radial-gradient(circle at 95% 20%, rgba(21,128,61,.05), transparent 28%),
    var(--bg);
}
  :root[data-theme="dark"] body{
  background:
    radial-gradient(circle at 15% -10%, rgba(110,160,255,.10), transparent 38%),
    radial-gradient(circle at 95% 20%, rgba(74,222,128,.04), transparent 28%),
    var(--bg);
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body{
    background:
      radial-gradient(circle at 15% -10%, rgba(110,160,255,.10), transparent 38%),
      radial-gradient(circle at 95% 20%, rgba(74,222,128,.04), transparent 28%),
      var(--bg);
  }
}
body::before{
  content:"";
  position:fixed;
  inset:0 0 auto;
  height:env(safe-area-inset-top,0px);
  background:var(--bg);z-index:10
  }
main{
  max-width:560px;
  margin:0 auto;
  padding:16px 16px 130px
  }
h1{  
  margin:0 0 10px;
  font-size:2rem;
  line-height:1.1;
  letter-spacing:-.03em;
  }
h2{
  font-size:1.15rem;
  margin:1.2em 0 .4em
  }
p{
  margin:.5em 0
}
.muted{
  color:var(--muted);
  font-size:.92rem
  }
button{
  font:inherit;
  cursor:pointer;
  border:0;
  border-radius:14px;
  min-height:52px;
  padding:12px 18px;
  font-weight:650
  }
.primary{
  background:var(--brand);
  color:#fff;
  width:100%
  }
.topbar{
  display:flex;
  justify-content:space-between;
  font-weight:650;
  font-size:.95rem;
  margin-bottom:6px
  }
.bar{
  height:6px;
  background:var(--line);
  border-radius:3px;
  overflow:hidden;
  margin-bottom:14px
  }
.bar i{
  display:block;
  height:100%;
  background:var(--brand);
  transition:width .3s
  }
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 1px 2px rgba(15, 23, 42, .04);
}
  .card.fact{
  border-left:5px solid var(--brand);
  background:linear-gradient(135deg, var(--card), color-mix(in srgb, var(--brand) 4%, var(--card)));
}
.card.fact > b{
  display:block;
  font-size:1.05rem;
  margin-bottom:12px;
}
.typ{
  font-weight:700;
  margin-bottom:8px
  }
.part{
  padding:10px 12px;
  margin:6px 0;
  border-radius:10px;
  border:2px solid transparent;
  background:var(--bg);
  word-break:break-word;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent
  }
.part small{
  display:block;
  color:var(--muted);
  font-size:.78rem
  }
.part.marked{
  border-color:var(--warn);
  background:var(--warnbg);
}
.part.ok{
  border-color:var(--ok);
  background:var(--okbg);
}
.part.bad{
  border-color:var(--bad);
  background:var(--badbg);
}
.part.miss{
  border-color:var(--miss);
  border-style:dashed;
  background:var(--missbg);
}
.part.link{
  color:var(--brand);
  text-decoration:underline;
}
.sms .part,
.call .part{
  border-radius:18px 18px 18px 4px;
  max-width:92%;
}
.call .part::before{
  content:"🗣️ ";
}
.status{
  font:.85rem ui-monospace, Menlo, monospace;
  background:var(--bg);
  border:1px dashed var(--line);
  border-radius:8px;
  padding:8px 10px;
  margin-top:8px;
  min-height:2.4em;
  word-break:break-all;
}
.part{
  position:relative;
}
.tip{
  position:absolute;
  left:6px;
  right:6px;
  bottom:calc(100% + 4px);
  z-index:6;
  pointer-events:none;
  background:#fffef0;
  color:#222;
  border:1px solid #777;
  border-radius:4px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
  padding:6px 8px;
  font:400 .8rem/1.35 "Segoe UI", system-ui, sans-serif;
  text-decoration:none;
  text-align:left;
  word-break:break-all;
}
.tip b{
  display:block;
  font-weight:600;
  color:#0f4fb0;
  margin-top:2px;
}
.res{
  border-radius:12px;
  padding:12px;
  margin:8px 0;
  border-left:6px solid;
}
.res.ok{
  background:var(--okbg);
  border-color:var(--ok);
}
.res.bad{
  background:var(--badbg);
  border-color:var(--bad);
}
.res.miss{
  background:var(--missbg);
  border-color:var(--miss);
}
.res b{
  display:block;
}
.banner{
  font-size:1.2rem;
  font-weight:750;
  padding:14px;
  border-radius:14px;
  margin:10px 0;
}
.banner.ok{
  background:var(--okbg);
  color:var(--ok);
}
.banner.bad{
  background:var(--badbg);
  color:var(--bad);
}
.actions{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:var(--card);
  border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  z-index:20;
}
.actions .in{
  max-width:560px;
  margin:0 auto;
  display:flex;
  gap:10px;
}
.actions .hint{
  max-width:560px;
  margin:0 auto 6px;
  text-align:center;
  font-size:.85rem;
  color:var(--muted);
}
.btn-echt{
  background:var(--ok);
  color:#fff;
  flex:1;
}
.btn-fake{
  background:var(--bad);
  color:#fff;
  flex:1;
}
:root[data-theme="dark"] .btn-echt,:root[data-theme="dark"] .btn-fake{color:#0e1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-echt,:root:not([data-theme="light"]) .btn-fake{color:#0e1420}}
.fact .frow{
  display:grid;
  grid-template-columns:130px 1fr;
  align-items:center;
  gap:12px;
  padding:11px 0;
  border-top:1px solid var(--line);
}
.fact .frow span{
  font-size:.78rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--muted);
}
.fact code{
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:.95rem;
  font-weight:700;
  color:var(--text);
}
@media(max-width:420px){
  .fact .frow{
    grid-template-columns:1fr;
    gap:2px;
  }
}
.steps{
  padding:0;
  margin:14px 0 0;
  list-style:none;
}
.steps li{
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:11px 0;
  border-top:1px solid var(--line);
}
.steps li:first-child{
  border-top:0;
  padding-top:0;
}
.steps li > span{
  display:grid;
  flex:0 0 28px;
  width:28px;
  height:28px;
  place-items:center;
  border-radius:50%;
  background:var(--brand);
  color:#fff;
  font-size:.82rem;
  font-weight:800;
}
.start-meta{
  padding:10px 12px;
  border-left:3px solid var(--brand);
  background:color-mix(in srgb, var(--brand) 6%, transparent);
  border-radius:0 8px 8px 0;
}
.steps strong{
  font-weight:750;
}  
.card.mail{
  padding:0;
  overflow:hidden;
}
.card.mail .status{
  margin:8px 14px 14px;
}
.ol{
  font-family:"Segoe UI", system-ui, sans-serif;
  background:var(--card);
  color:var(--text);
}
.olbar{
  background:#0f6cbd;
  color:#fff;
  padding:10px 14px;
  font-weight:600;
  display:flex;
  gap:8px;
  align-items:center;
}
.olbar b{
  background:#fff;
  color:#0f6cbd;
  border-radius:4px;
  width:22px;
  height:22px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.oltools{
  display:flex;
  gap:16px;
  padding:8px 14px;
  border-bottom:1px solid var(--line);
  font-size:.85rem;
  color:#0f6cbd;
  overflow-x:auto;
  white-space:nowrap;
}
.olsubj{
  padding:6px 6px 0;
}
.olsubj .part{
  font-size:1.2rem;
  font-weight:600;
}
.olfrom{
  display:flex;
  gap:10px;
  padding:0 14px 0 14px;
  align-items:flex-start;
}
.av{
  flex:none;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#8764b8;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  margin-top:6px;
}
.olf{
  min-width:0;
  flex:1;
}
.olmeta{
  font-size:.8rem;
  color:var(--muted);
  padding:0 8px;
}
.olbody{
  padding:8px 14px 14px;
  border-top:1px solid var(--line);
  margin-top:8px;
}
.ol .part{
  border-radius:3px;
  padding:6px 8px;
  margin:2px 0;
}
.ol .part:not(.marked):not(.ok):not(.bad):not(.miss){
  background:transparent;
}
.ol .part small{
  display:none;
}
:focus-visible{
  outline:3px solid var(--brand);
  outline-offset:2px;
}
</style>
</head>
<body>
<main id="app"></main>
<div class="actions" id="actions"></div>

<script>
/* Jedes Szenario hat:
     typ      : "mail", "sms" oder "call"
     phishing : true = Fake, false = echt
     titel    : Überschrift über der Nachricht
     kopf     : Liste von Kopfzeilen (z. B. Absender, Betreff)
     koerper  : Liste von Textstellen (Text der Nachricht)
     fazit    : Zusammenfassung, die nach der Auswertung erscheint
   Jede Stelle (Part) hat:
     l  = kleine Beschriftung (optional, z. B. "Von")
     t  = angezeigter Text
     v  = true, wenn die Stelle verdächtig ist (Warnzeichen)
     e  = Erklärung, die nach der Auswertung angezeigt wird
     z  = (optional) echtes Ziel eines Links, wird beim Antippen angezeigt
   Die Bank ist erfunden („Deine Bank“, offizielle Domain: deine-bank.de).
   */
const szenarien = [
  {
    typ:"mail", phishing:true, titel:"📧 E-Mail",
    kopf:[
      {l:"Von", t:"Deine Bank Service &lt;service@deine.bank.de&gt;", v:true,
       e:"Genau hinschauen: @deine.bank.de hat einen Punkt statt Bindestrich. Die echte Domain ist @deine-bank.de."},
      {l:"Betreff", t:"DRINGEND: Ihr Konto wird heute gesperrt!!", v:true,
       e:"Drohung und Ausrufezeichen sollen Angst machen. Banken sperren Konten nicht per Mail-Drohung."}
    ],
    koerper:[
      {t:"Sehr geehrter Kunde,", v:true, e:"Unpersönliche Anrede. Deine Bank kennt deinen Namen."},
      {t:"wir haben ungewöhnliche Aktivitäten festgestellt. Bestätigen Sie Ihre Daten innerhalb von 24 Stunden, sonst wird Ihr Konto dauerhaft gesperrt.", v:true,
       e:"Zeitdruck ist der Klassiker. Du sollst nicht nachdenken, sondern sofort handeln."},
      {t:"www.deine-bank.de/login-pruefen", v:true, z:"http://deine-bank.de.konto-check.net/login",
       e:"Der Text sieht echt aus. Das wahre Ziel endet aber auf konto-check.net. Entscheidend ist der Teil direkt vor dem ersten „/“, nicht der Anfang."},
      {t:"Geben Sie dort Ihre PIN und eine TAN ein.", v:true, e:"Eine Bank fragt NIE per Mail nach PIN oder TAN."},
      {t:"Mit freundlichen Grüßen, Deine Bank", v:false, e:"Eine Grußformel sagt nichts aus. Betrüger kopieren sie leicht."}
    ],
    fazit:"Fake: falsche Domain, Druck, Link zu einer fremden Seite und Abfrage von PIN/TAN. Richtig: Mail löschen oder melden, bei Zweifeln die Bank selbst anrufen."
  },
  /* 2 – ECHTE MAIL: Wartungshinweis*/
  {
    typ:"mail", phishing:false, titel:"📧 E-Mail",
    kopf:[
      {l:"Von", t:"Deine Bank &lt;service@deine-bank.de&gt;", v:false, e:"Die Domain @deine-bank.de ist genau die offizielle. Gutes Zeichen, aber allein noch kein Beweis."},
      {l:"Betreff", t:"Wartungsarbeiten am Samstag, 22. November", v:false, e:"Sachlicher Betreff, kein Druck, keine Drohung."}
    ],
    koerper:[
      {t:"Guten Tag Frau Schneider,", v:false, e:"Persönliche Anrede mit Namen."},
      {t:"am Samstag zwischen 2 und 5 Uhr ist das Online-Banking wegen Wartungsarbeiten nicht erreichbar.", v:false, e:"Reine Information. Es wird nichts von dir verlangt."},
      {t:"Bitte nutzen Sie das Online-Banking danach wie gewohnt über Ihre App oder Ihr Lesezeichen.", v:false, e:"Kein Link, die Bank verweist auf den gewohnten Weg. So macht man es richtig."},
      {t:"Ihre Daten oder TANs benötigen wir dafür nicht.", v:false, e:"Die Bank sagt ausdrücklich, dass sie nichts abfragt."}
    ],
    fazit:"Echt: Sie informiert nur, verlangt nichts, enthält keinen Link und spricht dich persönlich an."
  },
  /* 3 – FAKE-SMS: Kurzlink + App-Installation*/
  {
    typ:"sms", phishing:true, titel:"💬 SMS auf dem Handy",
    kopf:[{l:"Absender", t:"+44 7700 900123", v:true, e:"Eine ausländische Handynummer als „Bank“ ist verdächtig. Banken nutzen bekannte Absender."}],
    koerper:[
      {t:"Deine Bank: Ihre pushTAN-App läuft ab. Sie können keine Überweisungen mehr tätigen.", v:true, e:"Erfundene Dringlichkeit. Deine App läuft nicht per SMS-Hinweis ab."},
      {t:"Neue Sicherheits-App jetzt installieren:", v:true, e:"Apps lädst du nur aus dem offiziellen App Store, nie über einen SMS-Link."},
      {t:"https://bit.ly/deine-bank-app", v:true, z:"https://bit.ly/deine-bank-app → leitet weiter auf apk-download.example",
       e:"Kurzlinks verstecken das Ziel. Eine Bank verschickt keine Kurzlinks mit Download."}
    ],
    fazit:"Fake (Smishing): fremde Nummer, Druck und Link zu einer angeblichen App. Richtig: SMS löschen, nicht antippen."
  },
  /* 4 – ECHTE SMS: TAN*/
  {
    typ:"sms", phishing:false, titel:"💬 SMS auf dem Handy",
    kopf:[{l:"Absender", t:"Deine Bank", v:false, e:"Die Nachricht steht im gleichen Verlauf wie frühere TAN-SMS. Das ist normal."}],
    koerper:[
      {t:"Ihre TAN: 482915 für Überweisung von 25,00 € an Elektro Müller GmbH.", v:false, e:"Betrag und Empfänger werden genannt. Passt, wenn du das gerade selbst gemacht hast."},
      {t:"Geben Sie die TAN nur ein, wenn Sie die Überweisung selbst veranlasst haben. Niemals weitergeben.", v:false, e:"Echte TAN-Nachrichten warnen vor Weitergabe."}
    ],
    fazit:"Echt, aber nur, wenn DU die Überweisung gestartet hast. Kommt eine TAN ohne dein Zutun, ist das ein Alarmsignal."
  },
  /* 5 – FAKE-ANRUF: Sicherheitsüberweisung*/
  {
    typ:"call", phishing:true, titel:"📞 Anruf auf dem Handy",
    kopf:[{l:"Anrufer-Anzeige", t:"Deine Bank Kundenservice (angezeigt)", v:true, e:"Die Anzeige kann gefälscht sein („Call-ID-Spoofing“). Ein Name auf dem Display beweist nichts."}],
    koerper:[
      {t:"Guten Tag, hier Herr Wagner von der Sicherheitsabteilung Ihrer Bank. Auf Ihrem Konto gibt es gerade verdächtige Abbuchungen.", v:true, e:"Du hast nichts gemacht und wirst trotzdem angerufen. Der Anrufer baut Angst auf."},
      {t:"Wir müssen sofort handeln. Ich schicke Ihnen eine TAN aufs Handy, die lesen Sie mir bitte vor.", v:true, e:"TAN niemals telefonisch weitergeben. Der Betrüger bestätigt damit seine eigene Überweisung."},
      {t:"Danach veranlasse ich eine Sicherheitsüberweisung auf ein geschütztes Konto.", v:true, e:"Eine „Sicherheitsüberweisung“ gibt es nicht. Wer dich Geld verschieben lässt, will es stehlen."},
      {t:"Legen Sie bitte nicht auf und sprechen Sie mit niemandem darüber.", v:true, e:"Isolation verhindert, dass du nachdenkst oder jemanden fragst."}
    ],
    fazit:"Fake (Vishing): Druck, TAN-Abfrage, „Sicherheitsüberweisung“ und Geheimhaltung. Richtig: auflegen und die Bank selbst anrufen."
  },
  /* 6 – FAKE-MAIL: Rechnung mit gefährlichem Anhang, Domain ohne Bindestrich*/
  {
    typ:"mail", phishing:true, titel:"📧 E-Mail",
    kopf:[
      {l:"Von", t:"Deine Bank Rechnungen &lt;rechnung@deinebank.de&gt;", v:true, e:"@deinebank.de: Der Bindestrich fehlt. Die echte Domain ist @deine-bank.de."},
      {l:"Betreff", t:"Rechnung Nr. 4471 – Mahnung", v:false, e:"Der Betreff allein ist unauffällig. Wichtig ist, ob du etwas bestellt hast."}
    ],
    koerper:[
      {t:"Hallo Frau Schneider,", v:false, e:"Mit Namen angesprochen, das wirkt echt. Betrüger kennen oft Namen aus Datenlecks, deshalb ist es kein Beweis."},
      {t:"für Ihr Konto wurde eine Gebühr fällig. Die Rechnung finden Sie im Anhang.", v:true, e:"Du erwartest keine Rechnung und es wird kein Grund genannt. Die Bank wirft keine Gebühren ohne Erklärung per Mail auf."},
      {t:"📎 Rechnung_4471.pdf.exe (312 KB)", v:true, z:"Dateityp: Programm (.exe) – kein PDF!",
       e:"Hinter „.pdf“ steht noch „.exe“. Das ist ein Programm, kein Dokument, und kann Schadsoftware installieren."},
      {t:"Bei Nichtzahlung entstehen Mahnkosten von 40 €.", v:true, e:"Drohung mit Kosten erzeugt Druck."}
    ],
    fazit:"Fake: falsche Domain, unerwartete Rechnung, Anhang mit Doppelendung (.pdf.exe). Nie unerwartete Anhänge öffnen."
  },
  /* 8 – ECHTER ANRUF: Rückruf, den DU angefordert hast*/
  {
    typ:"call", phishing:false, titel:"📞 Anruf auf dem Handy",
    kopf:[{l:"Anrufer-Anzeige", t:"Deine Bank (gespeicherter Kontakt)", v:false, e:"Die Nummer hast du selbst gespeichert. Trotzdem gilt: Anzeigen können gefälscht sein, deshalb zählt der Inhalt."}],
    koerper:[
      {t:"Guten Tag Frau Schneider, hier Deine Bank. Sie hatten heute Morgen über die App einen Rückruf zu Ihrer Kartenabrechnung angefordert.", v:false, e:"Der Anruf passt zu etwas, das DU selbst angefordert hast."},
      {t:"Ich muss nur kurz prüfen, ob ich mit der richtigen Person spreche. Ihre PIN oder eine TAN brauche ich dafür nicht.", v:false, e:"Die Bank sagt von sich aus, dass sie keine Geheimzahlen will."},
      {t:"Wenn Sie lieber auflegen und uns unter der Nummer auf Ihrer Karte zurückrufen, ist das jederzeit in Ordnung.", v:false, e:"Ein echter Mitarbeiter bietet Rückruf an und macht keinen Druck."}
    ],
    fazit:"Echt: Du hattest den Rückruf angefordert, es gibt keinen Druck und keine Abfrage von PIN/TAN. Im Zweifel auflegen und selbst zurückrufen."
  },
  /* 9 – FAKE-MAIL: Prämie, echte Domain steht nur vorne im Namen*/
  {
    typ:"mail", phishing:true, titel:"📧 E-Mail",
    kopf:[
      {l:"Von", t:"Deine Bank Aktion &lt;aktion@deine-bank.de.praemien-center.com&gt;", v:true, e:"Entscheidend ist das Ende hinter dem letzten Punkt: Die Adresse gehört zu praemien-center.com. „deine-bank.de“ steht nur davor als Tarnung."},
      {l:"Betreff", t:"🎁 50 € Treueprämie für Sie – nur bis Mitternacht", v:true, e:"Geschenk plus Frist: Gier und Zeitdruck in einem."}
    ],
    koerper:[
      {t:"Herzlichen Glückwunsch! Als treuer Kunde erhalten Sie 50 € Cashback.", v:true, e:"Unaufgeforderte Geschenke sind ein Köder."},

/* 
   PROGRAMMLOGIK
*/
const PUNKTE_FUND = 10;    // Punkte für richtig markierte Warnzeichen
const PUNKTE_VERDIKT = 20; // Punkte für richtiges „Echt / Fake“
const MINUS_ALARM = 5;     // Abzug für Fehlalarm

let liste = [], nr = 0, punkte = 0, markiert = new Set(), fertig = false;
const app = document.getElementById("app");
const actions = document.getElementById("actions");

// Reihenfolge mischen
function mischen(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

// Maximal erreichbare Punkte (für die Endauswertung)
function maxPunkte(){ return liste.reduce((s,z)=> s + PUNKTE_VERDIKT + alleStellen(z).filter(p=>p.v).length*PUNKTE_FUND, 0); }
function alleStellen(z){ return z.kopf.concat(z.koerper); }

/*Startseite*/
function start(){
  const fakeSzenarien = szenarien.filter(s => s.phishing === true);
  const echteSzenarien = szenarien.filter(s => s.phishing === false);

  const dreiFakes = mischen(fakeSzenarien).slice(0, 3);
  const zweiEchte = mischen(echteSzenarien).slice(0, 2);

  liste = mischen([...dreiFakes, ...zweiEchte]);
  nr = 0;
  punkte = 0;

  app.innerHTML = `
    <h1>
      <span class="eyebrow">PHISHING-CHECK</span>
      Echt oder Fake?
    </h1>

    <p>Betrüger versuchen, an dein Geld oder deine Bankdaten zu kommen. Teste, ob du sie erkennst.</p>

    <div class="card fact">
      <b>Die Ausgangslage</b>
      <p>Du bist Kunde bei dieser Bank. Das sind ihre <b>echten</b> Daten:</p>

      <div class="frow">
        <span>Bankname</span>
        <code>Deine Bank</code>
      </div>

      <div class="frow">
        <span>Echte Domain-Adresse</span>
        <code>@deine-bank.de</code>
      </div>

      <div class="frow">
        <span>Echte Website</span>
        <code>www.deine-bank.de</code>
      </div>

      <p class="muted">
        Hinter dem @ muss genau <b>deine-bank.de</b> stehen.
        Deine Bank fragt <b>nie</b> nach PIN, Passwort oder TAN.
      </p>
    </div>

    <div class="card howto">
      <b>So funktioniert der Check</b>

      <ol class="steps">
        <li>
          <span>1</span>
          <div>
            <strong>Nachricht lesen</strong><br>
            Prüfe Absender, Inhalt und Links.
          </div>
        </li>
        <li>
          <span>2</span>
          <div>
            <strong>Verdächtige Stellen markieren</strong><br>
            Tippe alles an, was dir auffällt.
          </div>
        </li>
        <li>
          <span>3</span>
          <div>
            <strong>Entscheidung treffen</strong><br>
            Ist die Nachricht echt oder ein Fake?
          </div>
        </li>
        <li>
          <span>4</span>
          <div>
            <strong>Auswertung ansehen</strong><br>
            Du erhältst Hinweise zu jeder Stelle.
          </div>
        </li>
      </ol>
    </div>

    <p class="muted start-meta">
      5 zufällige Nachrichten · ca. 3 Minuten · direktes Feedback
    </p>
  `;

  actions.innerHTML = `
    <div class="in">
      <button class="primary" id="go">Phishing-Check starten</button>
    </div>
  `;

  document.getElementById("go").onclick = zeige;
}

/*Eine Nachricht anzeigen*/
function zeige(){
  const z = liste[nr]; markiert = new Set(); fertig = false;
  const alle = alleStellen(z);
  const teil = (p,i)=> `<div class="part ${p.z?"link":""}" data-i="${i}" role="button" tabindex="0" aria-pressed="false">${p.l?`<small>${p.l}</small>`:""}${p.t}</div>`;
  app.innerHTML = `
    <div class="topbar"><span>Nachricht ${nr+1} von ${liste.length}</span><span>⭐ ${punkte} Punkte</span></div>
    <div class="bar"><i style="width:${nr/liste.length*100}%"></i></div>
    <div class="card ${z.typ}">
      ${z.typ==="mail" ? "" : `<div class="typ">${z.titel}</div>`}
      ${z.typ==="mail" ? outlook(alle,teil) : alle.map(teil).join("")}
      <div class="status" id="status">Tippe Stellen an, die dir verdächtig vorkommen. Tippst du auf einen Link, siehst du sein wahres Ziel.</div>
    </div>
    <div id="ergebnis"></div>`;
  actions.innerHTML = `<div class="hint">Was denkst du?</div>
    <div class="in"><button class="btn-echt" id="echt">✅ Echt</button><button class="btn-fake" id="fake">🎣 Fake</button></div>`;
  document.getElementById("echt").onclick = ()=>auswerten(false);
  document.getElementById("fake").onclick = ()=>auswerten(true);
  app.querySelector(".card").onclick = tippen;
  app.querySelector(".card").onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); tippen(e);} };
}

/*Mail im Outlook-Look (alle[0]=Von, alle[1]=Betreff, Rest=Text)*/
function outlook(alle,teil){
  return `<div class="ol">
    <div class="olbar"><b>O</b> Outlook</div>
    <div class="oltools"><span>↩ Antworten</span><span>↪ Weiterleiten</span><span>🗑 Löschen</span><span>🚩 Melden</span></div>
    <div class="olsubj">${teil(alle[1],1)}</div>
    <div class="olfrom"><div class="av">${alle[0].t.charAt(0)}</div><div class="olf">${teil(alle[0],0)}<div class="olmeta">An: Sie · Do 19.11.2026 08:14</div></div></div>
    <div class="olbody">${alle.map((p,i)=> i>1 ? teil(p,i) : "").join("")}</div>
  </div>`;
}

/*Stelle antippen: markieren / Markierung entfernen*/
function tippen(e){
  if(fertig) return;
  const el = e.target.closest(".part"); if(!el) return;
  const i = +el.dataset.i, p = alleStellen(liste[nr])[i];
  if(markiert.has(i)){ markiert.delete(i); el.classList.remove("marked"); el.setAttribute("aria-pressed","false"); }
  else { markiert.add(i); el.classList.add("marked"); el.setAttribute("aria-pressed","true"); }
  // Bei Links das echte Ziel wie in der Browser-Statusleiste zeigen
  app.querySelectorAll(".tip").forEach(t=>t.remove());
  if(p.z){
    const t = document.createElement("div"); t.className = "tip";
    t.append(/^(Dateityp|Nach dem Scan)/.test(p.z) ? "Hinweis beim Öffnen" : "Klicken Sie, um dem Link zu folgen");
    const b = document.createElement("b"); b.textContent = p.z; t.append(b);
    el.appendChild(t);
  }
}

/*Auswertung*/
function auswerten(sagtFake){
  if(fertig) return; fertig = true;
  const z = liste[nr], alle = alleStellen(z);
  let funde=0, alarme=0, uebersehen=0, html="";
  alle.forEach((p,i)=>{
    const el = app.querySelector(`[data-i="${i}"]`), m = markiert.has(i);
    if(m && p.v){ funde++; el.className="part ok"+(p.z?" link":""); html+=res("ok","✔ Gut erkannt",p.e); }
    else if(m && !p.v){ alarme++; el.className="part bad"+(p.z?" link":""); html+=res("bad","✖ Hier war alles in Ordnung",p.e); }
    else if(!m && p.v){ uebersehen++; el.className="part miss"+(p.z?" link":""); html+=res("miss","❗ Übersehen",p.e); }
  });
  const richtig = (sagtFake === z.phishing);
  let pt = (richtig?PUNKTE_VERDIKT:0) + funde*PUNKTE_FUND - alarme*MINUS_ALARM;
  pt = Math.max(0, pt); punkte += pt;
  document.getElementById("ergebnis").innerHTML = `
    <div class="banner ${richtig?"ok":"bad"}">${richtig?"🎉 Richtig!":"😬 Leider falsch."} Das war ${z.phishing?"ein Fake":"echt"}.</div>
    <p><b>+${pt} Punkte</b> · ${funde} Warnzeichen gefunden, ${uebersehen} übersehen, ${alarme} Fehlalarm${alarme===1?"":"e"}</p>
    ${html}
    <div class="card"><b>Fazit</b><p>${z.fazit}</p></div>`;
  const letzte = nr === liste.length-1;
  actions.innerHTML = `<div class="in"><button class="primary" id="weiter">${letzte?"Zur Auswertung":"Nächste Nachricht"}</button></div>`;
  document.getElementById("weiter").onclick = ()=>{ if(letzte) ende(); else { nr++; zeige(); window.scrollTo(0,0);} };
  document.getElementById("ergebnis").scrollIntoView({behavior:"smooth",block:"start"});
}
function res(k,titel,text){ return `<div class="res ${k}"><b>${titel}</b>${text}</div>`; }

/*Endauswertung*/
function ende(){
  const max = maxPunkte(), proz = Math.round(punkte/max*100);
  const urteil = proz>=80 ? "🏆 Phishing-Profi! Dich legt so schnell keiner rein." : proz>=50 ? "👍 Solide! Mit etwas Übung erkennst du fast alles." : "📚 Noch Luft nach oben. Probier es gleich nochmal!";
  window.scrollTo(0,0);
  app.innerHTML = `
    <h1>Geschafft!</h1>
    <div class="banner ok">⭐ ${punkte} von ${max} Punkten (${proz} %)</div>
    <p>${urteil}</p>
    <div class="card"><b>Merke dir:</b>
      <p>🔒 Gib <b>niemals</b> PIN, Passwort oder TAN weiter – auch nicht, wenn sich jemand am <b>Telefon, per Mail, oder SMS/WhatsApp</b>als Mitarbeiter einer Bank ausgibt.<br>
      ⏱️ Zeitdruck und Drohungen sind ein Alarmsignal.<br>
      🔗 Links nicht antippen. Öffne dein Online-Banking oder deine Banking-App immer selbst, nie über einen Link.<br>
      📞 Unsicher? Leg auf und ruf die Bank unter der bekannten Nummer zurück.<br>
      🚨 Schon reingefallen? Sofort Bank anrufen, Karte sperren (Sperr-Notruf <b>116 116</b>) und Anzeige bei der Polizei erstatten.</p>
    </div>`;
  actions.innerHTML = `<div class="in"><button class="primary" id="neu">Nochmal spielen</button></div>`;
  document.getElementById("neu").onclick = start;
}

start();
</script>
